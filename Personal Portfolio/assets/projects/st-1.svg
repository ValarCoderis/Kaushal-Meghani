<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#121820"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(77, 163, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)"/>
  
  <!-- Outer Solar tracking circle & axes -->
  <circle cx="600" cy="260" r="100" fill="none" stroke="#26313C" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="480" y1="260" x2="720" y2="260" stroke="#26313C" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="140" x2="600" y2="380" stroke="#26313C" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Sun icon -->
  <circle cx="600" cy="260" r="42" fill="none" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <circle cx="600" cy="260" r="28" fill="none" stroke="#55C7E8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="600" cy="260" r="12" fill="#4DA3FF" opacity="0.9"/>
  <line x1="600" y1="205" x2="600" y2="192" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="600" y1="315" x2="600" y2="328" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="545" y1="260" x2="532" y2="260" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="655" y1="260" x2="668" y2="260" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="561" y1="221" x2="552" y2="212" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="639" y1="299" x2="648" y2="308" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="639" y1="221" x2="648" y2="212" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  <line x1="561" y1="299" x2="552" y2="308" stroke="#4DA3FF" stroke-width="2" opacity="0.8"/>
  
  <!-- Title -->
  <text x="600" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#F1F4F6" letter-spacing="3">SOLARTRACK</text>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#9AA6B2" letter-spacing="3">DUAL-AXIS SOLAR TRACKING &amp; MONITORING</text>
  
  <!-- Subtitle -->
  <text x="600" y="465" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#4DA3FF" letter-spacing="2">solartrack-omega.vercel.app</text>
  
  <!-- Department info -->
  <text x="600" y="515" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#9AA6B2" opacity="0.7">Department of Electrical Engineering · FoTE · MSU Baroda</text>
</svg>
